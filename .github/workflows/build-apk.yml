name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Flet y dependencias
        run: |
          pip install flet>=0.27.0 fpdf2>=2.7.9

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"
          channel: stable
          cache: true

      - name: Habilitar soporte Android en Flutter
        run: flutter config --enable-android

      - name: Construir APK
        run: |
          flet build apk . \
            --project "SMSpA" \
            --org com.smspa.jsolar \
            --build-version "1.0.0" \
            --build-number ${{ github.run_number }} \
            --product "SMSpA Proforma Solar"

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: smspa-proforma-solar-apk
          path: build/apk/app-release.apk
          retention-days: 30
